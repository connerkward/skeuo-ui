# Cloudflare Pages config for the /api/generate Function.
#
# Deploy:   npx wrangler pages deploy dist --project-name skeuo-ui
# Local CF: npx wrangler pages dev dist            (reads .dev.vars for FAL_KEY)
#
# FAL_KEY is a SECRET — set it in the Pages dashboard (Settings → Environment
# variables, encrypted) or via:  npx wrangler pages secret put FAL_KEY
# Never commit it. The functions/ dir is auto-discovered by Pages.
name = "skeuo-ui"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "dist"

# $10 LIFETIME spend cap for /api/generate — an edge-shared KV ledger (spend:cents,
# no TTL, does NOT auto-reset) so the public, discoverable endpoint can't run away
# with the fal/OpenAI bill. Cap is SPEND_CAP_CENTS (default 1000 = $10). /api/budget
# reads it for the UI. TOP UP / RESET (owner): zero the ledger or raise the cap —
#   npx wrangler kv key put --binding RATELIMIT spend:cents 0 --remote
# See functions/api/generate.ts.
[[kv_namespaces]]
binding = "RATELIMIT"
id = "eb42fcf3bd7c498d95889911ab1f86dd"

# R2: persist EVERY generated skin (frame.png + template.json + meta.json under
# skins/<id>/) so generations are a shared cloud library, served publicly via
# /api/asset/<key> and rebuilt by id via /api/skin/<id>. Create the bucket once:
#   npx wrangler r2 bucket create skeuo-skins
# (requires R2 enabled on the account via the Cloudflare dashboard).
[[r2_buckets]]
binding = "SKINS"
bucket_name = "skeuo-skins"

# Public base for stored skin artifacts. Defaults to the same-origin /api/asset
# route (functions/api/asset/[[path]].ts), so no extra var is needed unless you put
# a CDN / r2.dev domain in front of the bucket.
[vars]
ASSETS_BASE_URL = "/api/asset"
