# Cloudflare Pages config for the /api/generate Function.
#
# Deploy:   npx wrangler pages deploy dist --project-name skeuo-ui
# Local CF: npx wrangler pages dev dist            (reads .dev.vars for FAL_KEY)
#
# FAL_KEY is a SECRET — set it in the Pages dashboard (Settings → Environment
# variables, encrypted) or via:  npx wrangler pages secret put FAL_KEY
#
# GCP_SERVICE_ACCOUNT_KEY is an optional SECRET for the Director (prompt/vision →
# material/layout/control-boxes, src/generate/director.ts) — Gemini 3.1 Pro via
# VERTEX AI ONLY (2026-07: the OpenAI gpt-4o Director + vision fallback was removed
# entirely — ZERO gpt-4o, ZERO api.openai.com, ZERO OPENAI_API_KEY anywhere in this
# pipeline). One model covers text (deriveMaterial/deriveLayout) AND vision
# (extractSlots/extractMasks in functions/api/extract.ts) — it's natively multimodal.
#
# Deploy (one-time), project muser-2605300220:
#   gcloud iam service-accounts create skeuo-vertex --project=muser-2605300220
#   gcloud projects add-iam-policy-binding muser-2605300220 \
#     --member="serviceAccount:skeuo-vertex@muser-2605300220.iam.gserviceaccount.com" \
#     --role="roles/aiplatform.user"
#   gcloud iam service-accounts keys create sa-key.json \
#     --iam-account=skeuo-vertex@muser-2605300220.iam.gserviceaccount.com
#   npx wrangler pages secret put GCP_SERVICE_ACCOUNT_KEY < sa-key.json
#   rm sa-key.json   # never commit it — see .claude/rules/security-rule.md
# Until this secret is set, the Director transparently falls back to a deterministic
# keyword heuristic / null layout / empty control-boxes — generation never breaks.
# Local dev needs NO secret at all: it authenticates via the developer's own
# `gcloud auth print-access-token` session (server/gcloudAuth.ts).
#
# Never commit secrets. The functions/ dir is auto-discovered by Pages.
name = "skeuo-ui"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "dist"

# $10 LIFETIME spend cap for /api/generate — an edge-shared KV ledger (spend:cents,
# no TTL, does NOT auto-reset) so the public, discoverable endpoint can't run away
# with the fal/OpenAI bill. Cap is SPEND_CAP_CENTS (default 1000 = $10). /api/budget
# reads it for the UI. TOP UP / RESET (owner): zero the ledger or raise the cap —
#   npx wrangler kv key put --binding RATELIMIT spend:cents 0 --remote
# See functions/api/generate.ts.
[[kv_namespaces]]
binding = "RATELIMIT"
id = "eb42fcf3bd7c498d95889911ab1f86dd"

# R2: persist EVERY generated skin (frame.png + template.json + meta.json under
# skins/<id>/) so generations are a shared cloud library, served publicly via
# /api/asset/<key> and rebuilt by id via /api/skin/<id>.
# R2 ENABLED: bucket skeuo-skins exists. Writes are bounded by the $10 lifetime
# generation cap (~110 gens → ~330 small objects → trivial storage). Reads are
# CDN-cached (immutable Cache-Control on /api/asset/* in public/_headers) so R2
# Class-B ops only fire on a cache miss — the overage guard.
[[r2_buckets]]
binding = "SKINS"
bucket_name = "skeuo-skins"

# Stored skin artifacts are served same-origin via /api/asset (functions/api/asset).
[vars]
ASSETS_BASE_URL = "/api/asset"

# The /api/generate Function does heavy PURE-JS image work after the fal paint —
# UPNG decode + cutoutAlpha (connected-components/flood-fill) + UPNG re-encode of
# the paint PNG. That CPU (~2s) trips the default Worker CPU ceiling → CF error
# 1102 "Worker exceeded CPU time limit" (outcome=exceededCpu in `wrangler tail`).
# Raise the per-invocation CPU budget to the max (5 min). NOTE: cpu_ms only applies
# on the Workers Standard Usage Model (paid). On the free/Bundled plan it is ignored
# and the real fix is moving the heavy image work off the Worker (client-side cutout).
[limits]
cpu_ms = 300_000
