<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>pbrtest3 social 9:16 capture layout</title>
<!-- Capture harness: sized EXACTLY 1080x1920 for stepped frame capture
     (animexport/record_social.mjs). Embeds the REAL pbrtest3 renderer in an
     iframe (same shipping code path) with the studio chrome hidden, and a
     persistent bottom strip of the four most striking maps. -->
<style>
  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden;
               background: #0b0c10; font-family: -apple-system, system-ui, sans-serif; }
  #stage { position: relative; width: 1080px; height: 1414px; overflow: hidden; background: #0b0c10; }
  #demo  { position: absolute; top: 0; left: 0; width: 1080px; height: 1414px; border: 0; }
  #strip { box-sizing: border-box; width: 1080px; height: 506px; padding: 26px 33px 0; }
  #strip h3 { margin: 0 0 6px; font-size: 26px; font-weight: 600; letter-spacing: 0.2px;
              color: #e8e2d6; }
  #strip h3 b { color: #ff8a3c; font-weight: 700; }
  .tiles { display: flex; gap: 18px; margin-top: 14px; }
  .tile  { width: 240px; }
  .tile .im { width: 240px; height: 314px; border-radius: 10px; overflow: hidden;
              background: #000; border: 1px solid #262a33; }
  .tile img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .tile .lab { margin-top: 8px; font-size: 17px; font-weight: 700; letter-spacing: 1.6px;
               color: #aeb6c4; text-transform: uppercase; text-align: center; }
  .tile .lab span { color: #6b7383; font-weight: 500; letter-spacing: 0.4px;
                    text-transform: none; font-size: 14px; display: block; }
  .cap { margin-top: 14px; font-size: 15px; color: #6b7383; text-align: center; }
  .cap b { color: #98a1b1; font-weight: 600; }

  /* ?ar=1x1 -> 1080x1080 feed cut: stage left, maps as a 2x2 column right */
  body.ar1x1 { height: 1080px; display: flex; }
  .ar1x1 #stage { width: 700px; height: 916px; margin: 82px 0 0 26px; border-radius: 12px; }
  .ar1x1 #demo { width: 700px; height: 916px; }
  .ar1x1 #strip { width: 328px; height: auto; padding: 82px 26px 0 22px; }
  .ar1x1 #strip h3 { font-size: 21px; line-height: 1.3; }
  .ar1x1 .tiles { flex-wrap: wrap; gap: 14px; margin-top: 12px; }
  .ar1x1 .tile { width: 133px; }
  .ar1x1 .tile .im { width: 133px; height: 174px; }
  .ar1x1 .tile .lab { font-size: 12px; letter-spacing: 1px; margin-top: 5px; }
  .ar1x1 .tile .lab span { font-size: 10.5px; }
  .ar1x1 .cap { font-size: 12px; text-align: left; margin-top: 12px; line-height: 1.5; }
</style>
</head>
<body>
<div id="stage"><iframe id="demo"></iframe></div>
<div id="strip">
  <h3>one painted image &rarr; a <b>real-time relit</b> UI</h3>
  <div class="tiles">
    <div class="tile"><div class="im"><img src="../pbrtest2/diablo-src.png"></div>
      <div class="lab">Base<span>original paint</span></div></div>
    <div class="tile"><div class="im"><img src="../pbrtest2/diablo-height-patina.png"></div>
      <div class="lab">Height<span>fal-ai/patina</span></div></div>
    <div class="tile"><div class="im"><img src="../pbrtest2/diablo-normal-patina.png"></div>
      <div class="lab">Normal<span>fal-ai/patina</span></div></div>
    <div class="tile"><div class="im"><img src="diablo-emissive3.png"></div>
      <div class="lab">Emissive<span>v3 &middot; glyph-shaped, local $0</span></div></div>
  </div>
  <div class="cap">paint: <b>gemini-3-pro</b> (vertex) &middot; PBR maps: <b>fal-ai/patina</b> ($0.01/MP, one call)
    &middot; emissive + relight: <b>local, $0</b> &middot; total gen &asymp; <b>$0.03</b></div>
</div>
<script>
// forward our query (?bpm=&freeze=...) into the real renderer
const Q = new URLSearchParams(location.search);
const AR11 = Q.get('ar') === '1x1';
if (AR11) document.body.classList.add('ar1x1');
const f = document.getElementById('demo');
f.src = 'index.html' + location.search;
f.addEventListener('load', () => {
  const d = f.contentDocument;
  const st = d.createElement('style');
  st.textContent = `
    header, .panel, h2, .strip, footer, .badge { display: none !important; }
    body { background: #0b0c10 !important; overflow: hidden; }
    .wrap { padding: 0 !important; gap: 0 !important; }
    .stage { flex: none !important; max-width: none !important;
             width: ${AR11 ? 700 : 1080}px !important; min-width: 0 !important; }
    canvas.gl { border-radius: 0 !important; }`;
  d.head.appendChild(st);
  f.contentWindow.resize && f.contentWindow.resize();
  document.title = 'social layout ready';
});
</script>
</body>
</html>
