<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#060607" />
    <title>A skeuo.fm player — shared skin</title>
    <meta name="description" content="A real, working skeuomorphic music player generated on skeuo.fm. Connect Spotify and play your music through it, open it in the desktop player, or make your own." />
    <!-- the canonical share URL is per-skin (…/share?id=<id>); the page sets it at runtime -->
    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="skeuo.fm" />
    <meta property="og:title" content="A skeuo.fm player — shared skin" />
    <meta property="og:description" content="A real, working skeuomorphic music player generated on skeuo.fm. Connect Spotify and play through it, or make your own." />
    <meta property="og:image" content="https://skeuo.fm/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="A skeuo.fm player — shared skin" />
    <meta name="twitter:description" content="A real, working skeuomorphic music player generated on skeuo.fm." />
    <meta name="twitter:image" content="https://skeuo.fm/og-image.png" />
    <!-- per-skin display typefaces (the soul of skeuomorphic UI) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=VT323&family=Share+Tech+Mono&family=Orbitron:wght@500;700&family=Gochi+Hand&family=DotGothic16&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root">
      <main style="max-width:40rem;margin:18vh auto;padding:0 24px;font-family:system-ui,sans-serif;color:#ddd">
        <h1 style="font-size:28px;letter-spacing:-.01em;margin:0 0 .4em">skeuo.fm</h1>
        <p style="color:#9aa0ab;line-height:1.5;margin:0">Loading shared player…</p>
      </main>
    </div>
    <script type="module" src="/src/share/main.tsx"></script>
  </body>
</html>
