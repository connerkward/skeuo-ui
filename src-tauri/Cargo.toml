[package]
name = "skeuo"
version = "0.1.0"
description = "Skeuo — a transparent, skinnable desktop music widget"
authors = ["Conner Ward"]
edition = "2021"
rust-version = "1.77.2"

# The app logic lives in a lib so both the desktop binary and (future) mobile
# entry points share it. main.rs is a thin shim that calls skeuo_lib::run().
[lib]
name = "skeuo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

# macos-private-api must be in the BASE feature set so Tauri's build-script can
# match it against `app.macOSPrivateApi: true` in tauri.conf.json. The feature is
# inert on iOS (its code is cfg(target_os = "macos")), so this is harmless there.
[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api", "image-png"] }
tauri-plugin-deep-link = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Desktop-only: the menu-bar tray (the tray-icon crate doesn't build for iOS),
# window-state (position/size) persistence, and single-instance forwarding. None
# apply on iOS — one full-screen webview, no tray, no second instance.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-window-state = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
