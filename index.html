    <meta name="twitter:card" content="summary_large_image" />

    <!-- structured data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "skeuo.fm",
      "url": "https://skeuo.fm/",
      "description": "Turn a sentence into a real, working skeuomorphic music player that drives your actual music — live knobs, sliders, spectrum and marquee, generated from a prompt.",

      "operatingSystem": "Any (web)",
      "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
    }
    </script>
    <!-- per-skin display typefaces (the soul of skeuomorphic UI) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=VT323&family=Share+Tech+Mono&family=Orbitron:wght@500;700&family=Gochi+Hand&family=DotGothic16&display=swap" rel="stylesheet" />
  </head>

      <main style="max-width:40rem;margin:18vh auto;padding:0 24px;font-family:system-ui,sans-serif;color:#ddd">
        <h1 style="font-size:28px;letter-spacing:-.01em;margin:0 0 .4em">skeuo.fm</h1>
